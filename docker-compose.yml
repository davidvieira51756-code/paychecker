services:
  postgres:
    image: postgres:16-alpine
    container_name: paychecker-postgres
    environment:
      POSTGRES_DB: paychecker_db
      POSTGRES_USER: paychecker
      POSTGRES_PASSWORD: paychecker
    ports:
      - "5432:5432"
    volumes:
      - paychecker_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: paychecker-api
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paychecker_db
      SPRING_DATASOURCE_USERNAME: paychecker
      SPRING_DATASOURCE_PASSWORD: paychecker
      APP_JWT_SECRET: paychecker-local-development-secret-key-for-jwt-signing-must-be-long
      APP_JWT_EXPIRATION_MINUTES: 60
    ports:
      - "8080:8080"

volumes:
  paychecker_postgres_data:
